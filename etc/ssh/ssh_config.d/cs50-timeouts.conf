# Timeouts for ssh as a client, which git uses for ssh:// remotes (lib50, submit50, check50 among
# others). Without these, a connection stalled by an outage at the remote end never ends, and a web
# app that shelled out to git holds its Passenger process (one request each) until the server is
# restarted. ChannelTimeout matters because the remote sshd keeps answering keepalives even while
# the git process behind it is hung; it closes a session channel idle in both directions, so a
# transfer that is still moving data is unaffected. This image serves web apps, so no interactive
# ssh session is cut short by it either.
Host *
    ConnectTimeout 15
    ServerAliveInterval 15
    ServerAliveCountMax 2
    ChannelTimeout session=300
