on:
  - push
  - workflow_dispatch

# Tags published per build, mirroring cs50/cli (a pushed git tag is treated as "any other branch"):
#   main:                      amd64, arm64, latest; canary*; ubuntu-<RELEASE>*
#   a branch named ubuntu-<RELEASE>: built FROM cs50/cli:ubuntu-<RELEASE> (CLI_TAG below), and publishes
#                              ubuntu-<RELEASE>* only, so the image for another Ubuntu release can be built and
#                              tested without touching canary; cs50/cli's workflow re-dispatches this one on its
#                              same-named branch
#   any other branch named ubuntu-*: the build fails fast, since it would otherwise publish nothing
#   any other branch:          canary*
# where * means the -amd64 and -arm64 tags plus a multi-arch manifest, and RELEASE is read from the built image's
# /etc/os-release (i.e., the base image's).

jobs:
  build-amd64:
    runs-on: ubuntu-2604-64-cores-amd
    outputs:
      release: ${{ steps.release.outputs.release }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build for linux/amd64
        uses: docker/build-push-action@v7
        with:
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILDARCH=amd64
            CLI_TAG=${{ startsWith(github.ref, 'refs/heads/ubuntu-') && github.ref_name || 'latest' }}
          load: true
          platforms: linux/amd64
          tags: |
            cs50/server:amd64
            cs50/server:canary-amd64
          cache-from: type=registry,ref=cs50/server:amd64-buildcache
          cache-to: type=registry,ref=cs50/server:amd64-buildcache,mode=max

      - name: Squash for linux/amd64
        run: |
          pip3 install docker-squash
          docker-squash --tag cs50/server:amd64 cs50/server:amd64

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Determine Ubuntu release
        id: release
        run: |
          release=$(docker run --rm --entrypoint bash cs50/server:amd64 -c '. /etc/os-release && echo "$VERSION_ID"')
          [[ "$release" =~ ^[0-9]{2}\.[0-9]{2}$ ]] || { echo "::error::could not read VERSION_ID from the built image (got '$release')"; exit 1; }
          if [[ "$GITHUB_REF" == refs/heads/ubuntu-* && "$GITHUB_REF" != "refs/heads/ubuntu-$release" ]]; then
              echo "::error::branch $GITHUB_REF_NAME does not match the built image's Ubuntu release $release; nothing would be published"
              exit 1
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Smoke-test linux/amd64 build
        run: |
          bash tests/smoke.sh cs50/server:amd64

      - name: Push linux/amd64 build to Docker Hub
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          docker push cs50/server:amd64

      - name: Push linux/amd64 build to Docker Hub (canary)
        if: ${{ !startsWith(github.ref, 'refs/heads/ubuntu-') }}
        run: |
          docker push cs50/server:canary-amd64

      - name: Push linux/amd64 build to Docker Hub (ubuntu-${{ steps.release.outputs.release }})
        if: ${{ github.ref == 'refs/heads/main' || github.ref == format('refs/heads/ubuntu-{0}', steps.release.outputs.release) }}
        env:
          RELEASE: ${{ steps.release.outputs.release }}
        run: |
          docker tag cs50/server:amd64 cs50/server:ubuntu-"$RELEASE"-amd64
          docker push cs50/server:ubuntu-"$RELEASE"-amd64

  build-arm64:
    runs-on: ubuntu-2604-64-cores-arm
    outputs:
      release: ${{ steps.release.outputs.release }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build for linux/arm64
        uses: docker/build-push-action@v7
        with:
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILDARCH=arm64
            CLI_TAG=${{ startsWith(github.ref, 'refs/heads/ubuntu-') && github.ref_name || 'latest' }}
          load: true
          platforms: linux/arm64
          tags: |
            cs50/server:arm64
            cs50/server:canary-arm64
          cache-from: type=registry,ref=cs50/server:arm64-buildcache
          cache-to: type=registry,ref=cs50/server:arm64-buildcache,mode=max

      - name: Squash for linux/arm64
        run: |
          pip3 install docker-squash
          docker-squash --tag cs50/server:arm64 cs50/server:arm64

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Determine Ubuntu release
        id: release
        run: |
          release=$(docker run --rm --entrypoint bash cs50/server:arm64 -c '. /etc/os-release && echo "$VERSION_ID"')
          [[ "$release" =~ ^[0-9]{2}\.[0-9]{2}$ ]] || { echo "::error::could not read VERSION_ID from the built image (got '$release')"; exit 1; }
          if [[ "$GITHUB_REF" == refs/heads/ubuntu-* && "$GITHUB_REF" != "refs/heads/ubuntu-$release" ]]; then
              echo "::error::branch $GITHUB_REF_NAME does not match the built image's Ubuntu release $release; nothing would be published"
              exit 1
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Smoke-test linux/arm64 build
        run: |
          bash tests/smoke.sh cs50/server:arm64

      - name: Push linux/arm64 build to Docker Hub
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          docker push cs50/server:arm64

      - name: Push linux/arm64 build to Docker Hub (canary)
        if: ${{ !startsWith(github.ref, 'refs/heads/ubuntu-') }}
        run: |
          docker push cs50/server:canary-arm64

      - name: Push linux/arm64 build to Docker Hub (ubuntu-${{ steps.release.outputs.release }})
        if: ${{ github.ref == 'refs/heads/main' || github.ref == format('refs/heads/ubuntu-{0}', steps.release.outputs.release) }}
        env:
          RELEASE: ${{ steps.release.outputs.release }}
        run: |
          docker tag cs50/server:arm64 cs50/server:ubuntu-"$RELEASE"-arm64
          docker push cs50/server:ubuntu-"$RELEASE"-arm64

  finalize:
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    env:
      RELEASE: ${{ needs.build-amd64.outputs.release }}
    steps:
      - name: Check that both builds are the same Ubuntu release
        env:
          RELEASE_ARM64: ${{ needs.build-arm64.outputs.release }}
        run: |
          [[ -n "$RELEASE" && "$RELEASE" == "$RELEASE_ARM64" ]] || { echo "::error::amd64 is Ubuntu '$RELEASE' but arm64 is '$RELEASE_ARM64'; not publishing a mixed manifest"; exit 1; }

      - name: Log into Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create multi-arch manifest and push to Docker Hub
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          docker manifest create cs50/server:latest \
          --amend cs50/server:amd64 \
          --amend cs50/server:arm64
          docker manifest push cs50/server:latest

      - name: Create multi-arch manifest and push to Docker Hub (canary)
        if: ${{ !startsWith(github.ref, 'refs/heads/ubuntu-') }}
        run: |
          docker manifest create cs50/server:canary \
          --amend cs50/server:canary-amd64 \
          --amend cs50/server:canary-arm64
          docker manifest push cs50/server:canary

      - name: Create multi-arch manifest and push to Docker Hub (ubuntu-${{ env.RELEASE }})
        if: ${{ github.ref == 'refs/heads/main' || github.ref == format('refs/heads/ubuntu-{0}', needs.build-amd64.outputs.release) }}
        run: |
          docker manifest create cs50/server:ubuntu-"$RELEASE" \
          --amend cs50/server:ubuntu-"$RELEASE"-amd64 \
          --amend cs50/server:ubuntu-"$RELEASE"-arm64
          docker manifest push cs50/server:ubuntu-"$RELEASE"
